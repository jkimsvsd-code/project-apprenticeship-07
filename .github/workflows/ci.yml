name: Verify diary and authentication
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:check
      - run: npm run build
      - name: Verify actual local Worker HTTP boundaries
        shell: bash
        run: |
          npm run db:migrate
          mkdir -p .local
          npm run dev > .local/ci-server.log 2>&1 &
          task_server_pid=$!
          trap 'kill "$task_server_pid" 2>/dev/null || true' EXIT
          node -e 'let ready=false; for(let i=0;i<60;i++){try{const r=await fetch("http://127.0.0.1:5173/login");if(r.ok){ready=true;break}}catch{} await new Promise(r=>setTimeout(r,1000))} if(!ready)process.exit(1)'
          npm run test:http:auth
